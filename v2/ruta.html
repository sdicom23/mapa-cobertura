<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ruta con cobertura AT&T 4G / 3G</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="../estilos.css?v=202610080013" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../config.js?v=202610080013"></script>
<script src="v2.js?v=202610080013"></script>
</head>
<body>
<div id="map"></div>

<div class="panel arriba">
  <h1><span>Ruta con cobertura AT&T</span></h1>
  <div class="info" id="info">Calculando ruta…</div>
</div>

<div class="panel abajo">
  <div class="fila" id="tec"></div>
  <div class="fila" id="leyenda"></div>
</div>

<script>
const C = window.CONFIG;
const q = new URLSearchParams(location.search);
const leer = s => { const p = (s || '').split(',').map(Number); return p.length === 2 && p.every(n => !isNaN(n)) ? p : null; };
// o y d como lat,lon. Sin parámetros: ejemplo CDMX -> Pachuca
const O = leer(q.get('o')) || [19.4955, -99.1194];
const D = leer(q.get('d')) || [20.1011, -98.7591];
let tec = V2.tecInicial(), ruta = null, largo = 0, seg = 0, puntos = [];

const map = new maplibregl.Map({
  container: 'map', style: C.MAPA_BASE,
  bounds: [[Math.min(O[1], D[1]), Math.min(O[0], D[0])], [Math.max(O[1], D[1]), Math.max(O[0], D[0])]],
  fitBoundsOptions: { padding: 80 }, attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.on('load', async () => {
  V2.agregarCapas(map, 0.22);
  V2.mostrarTec(map, tec);
  V2.leyenda(document.getElementById('leyenda'), tec, 'linea');
  V2.selectorTec(document.getElementById('tec'), tec, t => {
    tec = t; V2.mostrarTec(map, t); V2.leyenda(document.getElementById('leyenda'), t, 'linea'); pintar();
  });

  try {
    const url = `${C.OSRM_URL}${O[1]},${O[0]};${D[1]},${D[0]}?overview=full&geometries=geojson`;
    const j = await (await fetch(url)).json();
    if (!j.routes || !j.routes.length) throw new Error('sin ruta');
    ruta = turf.lineString(j.routes[0].geometry.coordinates);
    largo = turf.length(ruta); seg = j.routes[0].duration;
  } catch (e) {
    document.getElementById('info').textContent = '❌ No se pudo calcular la ruta. Intenta de nuevo.';
    return;
  }

  map.addSource('ruta', { type: 'geojson', data: turf.featureCollection([]) });
  map.addLayer({ id: 'ruta-borde', type: 'line', source: 'ruta', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffffff', 'line-width': 9 } });
  map.addLayer({ id: 'ruta-linea', type: 'line', source: 'ruta', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-width': 6, 'line-color': ['get', 'color'] } });
  new maplibregl.Marker({ color: '#185FA5' }).setLngLat([O[1], O[0]]).addTo(map);
  new maplibregl.Marker({ color: '#E24B4A' }).setLngLat([D[1], D[0]]).addTo(map);
  map.fitBounds(turf.bbox(ruta), { padding: { top: 190, bottom: 120, left: 40, right: 40 }, duration: 0 });

  // Muestreo de la ruta: código 4G y 3G de cada tramo
  const paso = C.PASO_RUTA_KM;
  for (let d = 0; d < largo; d += paso) {
    const fin = Math.min(d + paso, largo);
    const a = turf.along(ruta, d).geometry.coordinates, b = turf.along(ruta, fin).geometry.coordinates;
    const m = turf.along(ruta, (d + fin) / 2).geometry.coordinates;
    puntos.push({ a, b, km: fin - d, m });
  }
  await Promise.all(puntos.map(async p => {
    [p.c4, p.c3] = await Promise.all([V2.codigo('4g', p.m[1], p.m[0]), V2.codigo('3g', p.m[1], p.m[0])]);
  }));
  pintar();
});

function pintar() {
  if (!puntos.length) return;
  const cod = p => tec === '4g' ? p.c4 : p.c3;
  const km = { 0: 0, 1: 0, 2: 0 }, otro = { 0: 0 };
  let cortes = 0, prev = null;
  const tramos = puntos.map(p => {
    const c = cod(p); km[c] += p.km;
    if (c === 0 && prev !== 0) cortes++; prev = c;
    if ((tec === '4g' ? p.c3 : p.c4) === 0) otro[0] += p.km;
    return turf.lineString([p.a, p.b], { color: V2.NIV[tec][c].color });
  });
  map.getSource('ruta').setData(turf.featureCollection(tramos));

  const N = V2.NIV[tec], T = V2.TEC[tec];
  const pct = v => Math.round(v / largo * 100);
  const f = v => v < 10 ? v.toFixed(1) : v.toFixed(0);
  const h = Math.floor(seg / 3600), mi = Math.round(seg % 3600 / 60);
  const otraTec = tec === '4g' ? '3g' : '4g';
  // Tip: el peor nivel con al menos 1 km (sin → cobertura), si no, garantizada
  const cTip = km[0] >= 1 ? 0 : (km[1] >= 1 ? 1 : 2);
  document.getElementById('info').innerHTML =
    `<b>${largo.toFixed(0)} km · ${h ? h + ' h ' : ''}${mi} min · ${T.nombre}: ${100 - pct(km[0])}% con cobertura</b><br>` +
    `<span class="sub">` + [2, 1, 0].filter(c => km[c] >= 0.05).map(c =>
      `<span class="sq" style="background:${N[c].color};opacity:1"></span> ${f(km[c])} km ${c === 2 ? 'garantizada' : c === 1 ? 'con cobertura' : 'sin cobertura'}`).join(' · ') +
    (cortes && km[0] >= 0.05 ? ` (${cortes} tramo${cortes > 1 ? 's' : ''})` : '') + `</span><br>` +
    `<span class="sub">${V2.TEC[otraTec].nombre}: ${100 - pct(otro[0])}% con cobertura</span>` +
    V2.tipHTML(N[cTip], N[cTip].etiqueta + (cTip !== 2 ? ' · ' + f(km[cTip]) + ' km' : ''));
}
</script>
</body>
</html>
