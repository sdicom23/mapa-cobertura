<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mapa de cobertura</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="estilos.css?v=202610080014" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js?v=202610080014"></script>
<script src="comun.js?v=202610080014"></script>
<style>
/* Ajustes directos para el botón de cierre y scroll controlado */
.btn-cerrar {
  background: transparent;
  border: none;
  font-size: 16px;
  color: var(--tx2, #5f5e5a);
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.btn-cerrar:hover {
  color: #000;
}
#btn-reabrir-info {
  display: none;
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--bd, #e2e0d8);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--tx, #1d1d1f);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.panel.arriba .info {
  max-height: 35vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
</style>
</head>
<body>
<div id="map"></div>

<!-- Botón flotante para reabrir el diagnóstico si se cerró -->
<button id="btn-reabrir-info" onclick="mostrarDiagnostico()">📋 Ver Info</button>

<div class="panel arriba" id="panel-diagnostico">
  <h1>
    <span>Cobertura</span>
    <span style="display:flex; align-items:center; gap:8px;">
      <span class="demo" id="demo">Datos de ejemplo</span>
      <button class="btn-cerrar" onclick="ocultarDiagnostico()" title="Cerrar panel">✖</button>
    </span>
  </h1>
  <div class="info" id="info">Toca el mapa para ver la cobertura en ese punto.</div>
</div>

<div class="panel abajo">
  <div class="fila" id="leyenda"></div>
  <div class="fila" id="operadores"></div>
</div>

<script>
const C = window.CONFIG, U = window.Comun;
const q = new URLSearchParams(location.search);
const lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
const hayPunto = !isNaN(lat) && !isNaN(lon);

const map = new maplibregl.Map({
  container: 'map', 
  style: C.MAPA_BASE,
  center: hayPunto ? [lon, lat] : C.CENTRO,
  zoom: hayPunto ? 11 : C.ZOOM,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

let capas = [], marcador = null;

map.on('load', async () => {
  const r = await U.cargarCoberturas(map, 0.4);
  capas = r.capas;
  if (r.demo) document.getElementById('demo').style.display = 'inline-block';
  U.botonesOperador(document.getElementById('operadores'), map, capas, () => {
    U.leyendaTecnologias(document.getElementById('leyenda'));
    if (marcador) ponerPunto(marcador.getLngLat().toArray());
  });
  U.leyendaTecnologias(document.getElementById('leyenda'));
  if (hayPunto) ponerPunto([lon, lat]);
});

map.on('click', e => ponerPunto([e.lngLat.lng, e.lngLat.lat]));

function ocultarDiagnostico() {
  document.getElementById('panel-diagnostico').style.display = 'none';
  document.getElementById('btn-reabrir-info').style.display = 'block';
}

function mostrarDiagnostico() {
  document.getElementById('panel-diagnostico').style.display = 'block';
  document.getElementById('btn-reabrir-info').style.display = 'none';
}

function tips(cob) {
  if (!cob.length) return U.tipHTML(C.TIP_SIN_SENAL, 'Sin cobertura');
  const conTip = cob.filter(c => c.tip);
  return conTip.map(c => U.tipHTML(c.tip, (conTip.length > 1 ? c.operador + ' · ' : '') + c.etiqueta)).join('');
}

function ponerPunto(lngLat) {
  mostrarDiagnostico();
  if (marcador) marcador.remove();
  marcador = new maplibregl.Marker({ color: '#E24B4A' }).setLngLat(lngLat).addTo(map);
  U.cuandoListo(map, () => {
    const cob = U.coberturaEn(map, lngLat, capas);
    const lineas = cob.map(c =>
      `<span class="sq" style="background:${c.color || '#9aa0a6'}"></span> ` +
      `<b>${U.esc(c.operador)}</b> ${U.esc(c.tecnologia)} · ${U.esc(c.etiqueta || c.calidad)}`);
    document.getElementById('info').innerHTML =
      `<div class="sub">${lngLat[1].toFixed(5)}, ${lngLat[0].toFixed(5)}</div>` +
      (lineas.length ? lineas.join('<br>') : '🔴 Sin cobertura registrada en este punto') +
      tips(cob);
  });
}
</script>
</body>
</html>
